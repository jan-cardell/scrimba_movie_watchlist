<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <script src="https://kit.fontawesome.com/04178da6f6.js" crossorigin="anonymous"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Find your film</h1> 
            <button id="watchlist-btn">My Watchlist</button>
        </header>
        <div id="search-field">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Search for a movie">
            <button id="search-btn">Search</button>
        </div>
        <div id="exploring">
            <i class="fa-solid fa-film"></i>
            <p>Start exploring</p>
        </div>
        
        
        
        <script src="index.js"></script>
    </body>
</html>
