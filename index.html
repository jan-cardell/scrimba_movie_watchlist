<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <script src="https://kit.fontawesome.com/04178da6f6.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <header>
            <h1>Find your film</h1> 
            <button id="watchlist-btn">My Watchlist</button>
        </header>
        <div id="search-field">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Search for a movie">
            <button>Search</button>
        </div>
        <div id="exploring">
            <i class="fa-solid fa-film"></i>
            <p>Start exploring</p>

        </div>
        
        
        
        <script src="index.js"></script>
    </body>
</html>
